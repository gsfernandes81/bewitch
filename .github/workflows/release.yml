# Test every push and pull request; publish to PyPI when a push to main carries
# a version PyPI does not have yet.
#
# Releasing is bumping `version` in pyproject.toml (and __version__ in
# bewitch/__init__.py, which a test holds to it) and landing that on main.
# Publishing is PyPI's trusted publishing: PyPI trusts this workflow, in this
# repository, running in the `pypi` environment, so no token is stored here.
# Set it up once on pypi.org (a "pending publisher" until the first upload):
#   owner gsfernandes81, repository bewitch, workflow release.yml,
#   environment pypi.
name: release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - id: version
        name: Is this version on PyPI yet?
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/bewitch/$version/json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$code" in
            404) echo "new=true" >> "$GITHUB_OUTPUT"; echo "bewitch $version is not on PyPI yet" ;;
            200) echo "new=false" >> "$GITHUB_OUTPUT"; echo "bewitch $version is already on PyPI" ;;
            *) echo "PyPI answered $code; not deciding a release on that" >&2; exit 1 ;;
          esac
      - run: uv build
      - name: The wheel installs and imports in a clean environment
        run: |
          uv venv /tmp/smoke
          uv pip install -p /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c 'import bewitch, sys; assert bewitch.__version__ == sys.argv[1], bewitch.__version__' "${{ steps.version.outputs.version }}"
          /tmp/smoke/bin/python -m bewitch > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bewitch/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          git tag "v${{ needs.build.outputs.version }}"
          git push origin "v${{ needs.build.outputs.version }}"
